name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
      DOCKER_IMAGE_NAME: "${{ secrets.DOCKER_IMAGE_NAME }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download JAR artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Docker image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKER_IMAGE_NAME: "${{ secrets.DOCKER_IMAGE_NAME }}"
      EC2_INSTANCE_ID: "${{ secrets.EC2_INSTANCE_ID }}"
      AWS_ROLE_ARN: "${{ secrets.AWS_ROLE_ARN }}"

    steps:
      - name: Debug AWS Role ARN
        run: |
          echo "ARN length: ${#AWS_ROLE_ARN}"
          echo "ARN set: $( [ -n \"$AWS_ROLE_ARN\" ] && echo 'yes' || echo 'NO - SECRET IS EMPTY' )"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.AWS_ROLE_ARN }}"
          aws-region: ap-northeast-2
          audience: sts.amazonaws.com

      - name: Create .env and deploy via SSM
        run: |
          DOCKER_IMAGE="$DOCKERHUB_USERNAME/$DOCKER_IMAGE_NAME:${{ github.event.workflow_run.head_sha }}"

          # GitHub Secrets → EC2 .env 파일 생성
          ENV_CONTENT=$(cat <<'ENVEOF'
          SPRING_PROFILES_ACTIVE=prod
          APPLYHOME_SERVICE_KEY=${{ secrets.APPLYHOME_SERVICE_KEY }}
          AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}
          ENVEOF
          )
          ENV_B64=$(echo "$ENV_CONTENT" | sed 's/^ *//' | base64 -w0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy getmyhome" \
            --timeout-seconds 120 \
            --parameters "commands=[
              \"echo $ENV_B64 | base64 -d > /home/ubuntu/.env\",
              \"docker pull $DOCKER_IMAGE\",
              \"docker stop getmyhome || true\",
              \"docker rm getmyhome || true\",
              \"docker run -d --name getmyhome --restart unless-stopped --env-file /home/ubuntu/.env -p 8080:8080 $DOCKER_IMAGE\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "배포 성공"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::error::배포 실패: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'StandardErrorContent' --output text
              exit 1
            fi

            echo "배포 진행 중... ($i/30)"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 타임아웃"
            exit 1
          fi